plugins {
	id 'architectury-plugin'
	id 'net.neoforged.moddev'
}

// architectury-plugin registers :common's `transformProduction*` tasks while evaluating :common, and
// this module references them below, so :common has to be evaluated first.
evaluationDependsOn(':common')

// NOTE: architectury-plugin's `neoForge()` transform is intentionally not declared. It requires a Loom
// extension in this project, and a Loom-based NeoForge setup aborts while merging the Mojang and
// NeoForge mappings (`RuntimeException: Unfixable conflicts` on 1.7.x, i.e. the 1.21.1 line). The
// ModDevGradle toolchain is what this tree uses - it is also what upstream ParCool 3.4.3.3 uses - and
// the distributable below is assembled explicitly instead.
//
// The step architectury-plugin would have done is a mojmap -> SRG remap, and it is not needed: the
// NeoForge production runtime loads mojmap-named vanilla members. Verified against a shipped NeoForge
// mod of this era (BetterThirdPerson 6455836, which requires MC [1.21.5,) / NF [21.5,)), whose own
// bytecode references `net/minecraft/client/CameraType` and `net/minecraft/client/DeltaTracker`
// rather than a single `m_` / `f_` token. So the mojmap-named artifact this module produces is
// already what NeoForge loads, and the access transformer in
// neoforge/src/main/resources/META-INF/accesstransformer.cfg is written in the same naming.

repositories {
	maven { url = 'https://www.cursemaven.com' }
	maven { url = 'https://maven.blamejared.com' }
	maven { url = 'https://maven.architectury.dev/' }
	mavenCentral()
	maven { url = 'https://maven.neoforged.net/releases/' }
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			// Same as the server run: mixin.debug makes the dev log list every applied ParCool mixin,
			// which is how the client half of the mixin set is verified.
			jvmArguments.addAll '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
			// `./gradlew :neoforge:runClient -PparcoolQuickPlay=host:port` boots straight into a server,
			// which is how a cross-loader join is reproduced without a mouse. See
			// BUILDING.md; the same property drives :fabric:runClient.
			if (project.hasProperty('parcoolQuickPlay')) {
				programArguments.addAll '--quickPlayMultiplayer', project.property('parcoolQuickPlay').toString()
			}
			if (project.hasProperty('parcoolQuickPlayWorld')) {
				programArguments.addAll '--quickPlaySingleplayer', project.property('parcoolQuickPlayWorld').toString()
			}
		}
		client2 {
			client()
			// A second client with its own game directory and a fixed name, so two ParCool players can
			// be on one NeoForge server at the same time - that is what exercises the action-state
			// broadcast path (ActionStateBroadcastPayload / ActionStatePayload) between two players.
			gameDirectory = project.file('run-client2')
			programArguments.addAll '--username',
					project.findProperty('parcoolUsername2') ?: 'NeoParCool2'
			jvmArguments.addAll '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
			if (project.hasProperty('parcoolQuickPlay')) {
				programArguments.addAll '--quickPlayMultiplayer', project.property('parcoolQuickPlay').toString()
			}
		}
		server {
			server()
			programArguments.addAll '--nogui'
			// Its own game directory so a dev server can run next to a dev client (ModDevGradle
			// defaults both to <module>/run, and the two would fight over saves, logs and options).
			gameDirectory = project.file('run-server')
			// mixin.debug makes the dev log list every applied ParCool mixin, which is how the
			// port's mixin set is verified without launching a client.
			jvmArguments.addAll '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

// Paraglider and EpicFight ship their own Minecraft mappings. Putting them on the resolvable
// compile/runtime classpath makes Loom merge those mappings into :common and abort with
// "Mapping source name conflicts detected". They are therefore kept in an isolated, resolvable-only
// configuration that is appended to :neoforge's own compile classpath and runtime classpath.
configurations {
	parcoolIntegrationsCompile {
		canBeConsumed = false
		canBeResolved = true
	}
	parcoolIntegrationsRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	// architectury-plugin's NeoForge transform output is named `<archivesName>-transformProductionNeoForge.jar`
	// (no version component), which no project-dependency notation can address, so it is wired as a
	// file with an explicit task dependency.
	implementation files(
			project(':common').tasks.named('transformProductionNeoForge').flatMap { it.archiveFile }
	)
	implementation "dev.architectury:architectury-neoforge:${project.architectury_api_version}"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	// mixin.extras is bundled by both loaders at runtime, but PlayerMixin compiles against its
	// annotations, so the compile classpath needs the artifact explicitly. Kept out of the *dist* jar:
	// shipping a second copy of MixinExtras is what the loaders' bundled one would conflict with.
	compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"

	// Optional integrations, and the only jars that had to move with the port. None of the four
	// publishes a 1.21.8 build, so each is compiled against the newest build that is still on the
	// 1.21.x side of its own API; all of them are compileOnly and report themselves absent at runtime
	// when the mod is missing or is a different build (see ModManager#isInstalled):
	//   Paraglider       6739612  Paraglider for MC 1.21.5. The 1.21.11 build (7794499) cannot be
	//                          used: Paraglider's own bytecode references net.minecraft.resources.
	//                          Identifier, which does not exist in 1.21.8, so the plugin API's
	//                          ResourceLocation-typed state ids would not even link.
	//   EpicFight        7489617  the 1.21.1 line, still the newest release
	//   BetterThirdPerson 6455836 the newest NeoForge build (1.21.8)
	//   ShoulderSurfing  6496668  the [1.21,) build, the same one :common compiles against
	// Patchouli is only an optional book dependency and is never referenced from source.
	parcoolIntegrationsCompile "curse.maven:paraglider-289240:6739612"
	parcoolIntegrationsCompile "curse.maven:EpicFight-405076:7489617"
	parcoolIntegrationsCompile "curse.maven:BetterThirdPerson-435044:6455836"
	parcoolIntegrationsCompile "curse.maven:ShoulderSurfing-243190:6496668"

	// Paraglider is the only integration the packaged jar actually needs at runtime: its
	// `@ParagliderPlugin` class is discovered by Paraglider's own plugin loader, so without the jar in
	// mods/ the plugin entry point is simply absent.
	parcoolIntegrationsRuntime "curse.maven:paraglider-289240:6739612"
}

tasks.named('compileJava') {
	classpath += configurations.parcoolIntegrationsCompile
}

tasks.named('neoForgeIdeSync') {
	// present on ModDevGradle 1.0.x; ignored when absent
}

/**
 * The distributable NeoForge jar: the mojmap-named :common artifact plus this module's own
 * classes, the loader metadata and the ServiceLoader registration.
 *
 * architectury-plugin's `neoForge()` transform normally does this, but it requires a Loom extension
 * in this project and `dev.architectury.loom` 1.7.x cannot set up NeoForge 21.1 (it aborts with
 * `RuntimeException: Unfixable conflicts` while merging the Mojang and NeoForge mappings), so the
 * assembly is done explicitly here, mirroring :fabric.
 */
// The access widener and the mixin config live in :common so both loaders ship the same copy. The
// dev runtime loads this module from its own sourceSet output, so the files have to be present here
// as well (the distributed jar picks them up from the :common transform artifact).
// Explodes the mojmap-named :common artifact so its classes are part of this module's own output.
def explodedCommon = layout.buildDirectory.dir('explodedCommon')

def explodeCommon = tasks.register('explodeCommon', Copy) {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	dependsOn ':common:transformProductionNeoForge'
	from { zipTree(project(':common').tasks.named('transformProductionNeoForge').get().archiveFile) }
	into explodedCommon
}

sourceSets.main.output.dir(explodedCommon, builtBy: explodeCommon)

processResources {
	from(project(':common').file('src/main/resources/parcool.accesswidener'))
	from(project(':common').file('src/main/resources/parcool-common.mixins.json'))
	// neoforge.mods.toml points LicenseFile at the LGPL text, so it has to be inside the jar.
	from(rootProject.file('LICENSE'))
}

processResources {
	def props = [
			mod_version    : project.mod_version,
			mod_name       : project.mod_name,
			mod_authors    : project.mod_authors,
			mod_license    : project.mod_license,
			minecraft_version: project.minecraft_version,
	]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.register('distJar', Jar) {
	group = 'build'
	description = 'Assembles the distributable NeoForge jar (common + neoforge module).'

	archiveClassifier = 'neoforge'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	// zipTree, not a plain file copy, so the common code is expanded into the output jar.
	from({
		zipTree(project(':common').tasks.named('transformProductionNeoForge').get().archiveFile.get().asFile)
	})
	from(sourceSets.main.output)
	from(configurations.parcoolIntegrationsRuntime.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }) {
		include 'META-INF/services/com.alrex.parcool.platform.ParCoolPlatform'
	}

	manifest {
		attributes(
				'Implementation-Title': project.mod_name,
				'Implementation-Version': project.mod_version,
				'Implementation-Vendor': project.mod_authors
		)
	}
}

tasks.named('assemble') {
	dependsOn 'distJar'
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
