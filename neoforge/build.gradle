plugins {
	id 'architectury-plugin'
	id 'net.neoforged.gradle.userdev'
}

// architectury-plugin registers :common's `transformProduction*` tasks while evaluating :common, and
// this module references them below, so :common has to be evaluated first.
evaluationDependsOn(':common')

// NeoGradle's userdev plugin is the toolchain here, not ModDevGradle: ModDevGradle resolves NeoForge
// through the `neoforge-moddev-bundle` capability, which the 20.5 line does not publish (it starts
// at 20.6), so `:neoforge` would fail with "Unable to find a variant providing the requested
// capability 'net.neoforged:neoforge-moddev-bundle'". NeoGradle consumes the `userdev` artifact that
// the 20.5 line does publish and is what the official MDK-1.20.5-NeoGradle uses.
//
// NOTE: architectury-plugin's `neoForge()` transform is intentionally not declared. It requires a
// Loom extension in this project, and `dev.architectury.loom` 1.7.x cannot merge the Mojang and
// NeoForge mappings (the base tree records the merge aborting with `RuntimeException: Unfixable
// conflicts`), so the distributable jar is assembled explicitly below, mirroring :fabric.

repositories {
	maven { url = 'https://www.cursemaven.com' }
	maven { url = 'https://maven.blamejared.com' }
	maven { url = 'https://maven.architectury.dev/' }
	mavenCentral()
	maven { url = 'https://maven.neoforged.net/releases/' }
}

// NeoForge reads the access transformer from `META-INF/neoforge.mods.toml` in a production jar; the
// dev runs need it registered here, or every widened member ParCool touches fails with
// IllegalAccessError in dev only.
minecraft {
	accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
	configureEach {
		// The mod's own classes and resources, so FML loads this module as a mod in dev. The
		// :common classes and assets are part of this source set's resources (see
		// processResources), which is what makes the common mixins resolvable in a dev run.
		modSource project.sourceSets.main
		// mixin.debug makes the dev log list every applied ParCool mixin, which is how the mixin set
		// is verified without an IDE.
		systemProperty 'mixin.debug', 'true'
		systemProperty 'mixin.debug.verbose', 'true'
	}
	client {
		workingDirectory project.file('run')
		// `./gradlew :neoforge:runClient -PparcoolQuickPlay=host:port` boots straight into a server and
		// `-PparcoolQuickPlayWorld=<name>` into a saved world, so the in-world paths - the ParCool
		// attributes resolve on the first Player#createAttributes, the render pass, the stamina HUD -
		// are reproducible without a mouse. Same properties drive :fabric:runClient.
		if (project.hasProperty('parcoolQuickPlay')) {
			arguments.addAll '--quickPlayMultiplayer', project.property('parcoolQuickPlay').toString()
		}
		if (project.hasProperty('parcoolQuickPlayWorld')) {
			arguments.addAll '--quickPlaySingleplayer', project.property('parcoolQuickPlayWorld').toString()
		}
	}
	server {
		argument '--nogui'
		// Its own game directory so a dev server can run next to a dev client (they would otherwise
		// fight over saves, logs and options).
		workingDirectory project.file('run-server')
	}
}

// Paraglider and EpicFight ship their own Minecraft mappings. Putting them on the resolvable
// compile/runtime classpath makes Loom merge those mappings into :common and abort with
// "Mapping source name conflicts detected". They are therefore kept in an isolated, resolvable-only
// configuration that is appended to :neoforge's own compile classpath and runtime classpath.
configurations {
	parcoolIntegrationsCompile {
		canBeConsumed = false
		canBeResolved = true
	}
	parcoolIntegrationsRuntime {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	// architectury-plugin's NeoForge transform output is named `<archivesName>-transformProductionNeoForge.jar`
	// (no version component), which no project-dependency notation can address, so it is wired as a
	// file with an explicit task dependency.
	implementation files(
			project(':common').tasks.named('transformProductionNeoForge').flatMap { it.archiveFile }
	)
	implementation "net.neoforged:neoforge:${project.neo_version}"
	implementation "dev.architectury:architectury-neoforge:${project.architectury_api_version}"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// Optional integrations. None of these mods published a 1.20.5/1.20.6 build - their release
	// lines jump from the 1.20.x era to 1.21 - so the 1.21.1 builds remain the API that
	// extern/* compiles against. Every entry point guards itself with
	// EpicFightManager#isEpicFightUsable, which reports the other mod absent when its classes are
	// not loadable, and ParCool then falls back to its own stamina system. Paraglider,
	// ShoulderSurfing and BetterThirdPerson are guarded the same way.
	// Patchouli is only an optional book dependency and is never referenced from source.
	parcoolIntegrationsCompile "curse.maven:paraglider-289240:6739615"
	parcoolIntegrationsCompile "curse.maven:EpicFight-405076:7489617"
	parcoolIntegrationsCompile "curse.maven:BetterThirdPerson-435044:5833474"
	parcoolIntegrationsCompile "curse.maven:ShoulderSurfing-243190:6496668"

	parcoolIntegrationsRuntime "curse.maven:paraglider-289240:6739615"
}

tasks.named('compileJava') {
	classpath += configurations.parcoolIntegrationsCompile
}

/**
 * The distributable NeoForge jar: the mojmap-named :common artifact plus this module's own
 * classes, the loader metadata and the ServiceLoader registration.
 *
 * architectury-plugin's `neoForge()` transform normally does this, but it requires a Loom extension
 * in this project and `dev.architectury.loom` 1.7.x cannot merge the Mojang and NeoForge mappings
 * (the base tree records the merge aborting with `RuntimeException: Unfixable conflicts`), so the
 * assembly is done explicitly here, mirroring :fabric.
 */
// The access widener and the mixin config live in :common so both loaders ship the same copy. The
// whole :common artifact is exploded into this module's resources: NeoGradle hands FML a dev mod
// built from the module's own classes and resources only - extra source-set output dirs and plain
// classpath jars are *not* part of the mod's file set, so without this the game starts with an
// empty parcool mod and Mixin aborts on the first common mixin with "InvalidMixinException: The
// specified mixin 'com.alrex.parcool.mixin.common.*' was not found". With the common classes,
// assets and data inside the mod's own resources, the dev run sees exactly what the distributable
// jar contains - and this module's own `jar` task is self-contained as a bonus.
def commonArtifactFile = project(':common').tasks.named('transformProductionNeoForge').flatMap { it.archiveFile }

processResources {
	from(commonArtifactFile.map { zipTree(it) })
	// neoforge.mods.toml points LicenseFile at the LGPL text, so it has to be inside the jar.
	from(rootProject.file('LICENSE'))
}

processResources {
	def props = [
			mod_version    : project.mod_version,
			mod_name       : project.mod_name,
			mod_authors    : project.mod_authors,
			mod_license    : project.mod_license,
			minecraft_version: project.minecraft_version,
	]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.register('distJar', Jar) {
	group = 'build'
	description = 'Assembles the distributable NeoForge jar (common + neoforge module).'

	archiveClassifier = 'neoforge'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	// The module's own output already carries the exploded :common classes, assets and data (see
	// processResources above), so this is just the module jar under its published name.
	from(sourceSets.main.output)
	from(configurations.parcoolIntegrationsRuntime.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }) {
		include 'META-INF/services/com.alrex.parcool.platform.ParCoolPlatform'
	}

	manifest {
		attributes(
				'Implementation-Title': project.mod_name,
				'Implementation-Version': project.mod_version,
				'Implementation-Vendor': project.mod_authors
		)
	}
}

tasks.named('assemble') {
	dependsOn 'distJar'
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
