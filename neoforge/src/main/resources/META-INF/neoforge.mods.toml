modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/alRex-U/ParCool/issues"

[[mods]]
modId = "parcool"
version = "${mod_version}"
displayName = "ParCool!"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/parcool"
logoFile = "parcool_logo.png"
authors = "alRex_U (original), ParCool Architectury API port"
description = '''
    This enable us act like parkour players.
    Enjoy Minecraft with cool actions!
'''

[[mixins]]
config = "parcool-common.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.parcool]]
modId = "neoforge"
type = "required"
versionRange = "[21.3.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.parcool]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.3,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.parcool]]
modId = "architectury"
type = "required"
versionRange = "[14.0.0,)"
ordering = "AFTER"
side = "BOTH"

# Optional integrations. Their code lives in the neoforge source set; on Fabric the platform
# implementation reports them as absent.
[[dependencies.parcool]]
modId = "paraglider"
type = "optional"
versionRange = "[21.1.5,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.parcool]]
modId = "epicfight"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.parcool]]
modId = "betterthirdperson"
type = "optional"
versionRange = "[1.9.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.parcool]]
modId = "shouldersurfing"
type = "optional"
versionRange = "[1.21.3-4.6.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.parcool]]
modId = "patchouli"
type = "optional"
versionRange = "*"
ordering = "AFTER"

# mixinextras supplies the @WrapWithCondition injector used by mixin/common/PlayerMixin. Both loaders
# bundle it, so it is declared explicitly rather than left as an implicit requirement: on Fabric this
# is the `custom.mixinextras` block, here it is an optional dependency.
[[dependencies.parcool]]
modId = "mixinextras"
type = "optional"
versionRange = "[0.4,)"
ordering = "NONE"
side = "BOTH"
