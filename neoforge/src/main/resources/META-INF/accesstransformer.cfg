public net.minecraft.client.renderer.RenderStateShard LIGHTMAP
public net.minecraft.client.renderer.RenderStateShard RENDERTYPE_LEASH_SHADER
public net.minecraft.world.entity.Entity onGround
public net.minecraft.world.damagesource.DamageSources *()
public net.minecraft.world.entity.player.Player canPlayerFitWithinBlocksAndEntitiesWhen(Lnet/minecraft/world/entity/Pose;)Z
