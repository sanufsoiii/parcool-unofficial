# Access transformers for NeoForge only; :common carries the equivalent access widener for Fabric.
#
# Names are Mojang-mapped on purpose. NeoForge's production runtime loads mojmap-named vanilla members:
# the neoforge-21.3.97 sources MDG compiles against are mojmap, and a shipped NeoForge mod's own
# accesstransformer.cfg (Paraglider-neoforge-21.1.5) lists `aboveGroundTickCount`, not an `f_110147_`
# token. An `f_...` entry in this file therefore never matches anything and the member stays as it is.
#
# Verified against the NeoForge 21.3.97 patched sources: LivingEntity#swimAmount / #swimAmountO,
# Entity#onGround and Player#canPlayerFitWithinBlocksAndEntitiesWhen are all already public there, and
# BlockEntityType's constructor is public as well - which is what lets
# NeoForgeParCoolPlatform#registerBlockEntityType build the type directly instead of going through the
# BlockEntityTypeInvoker mixin. That is why the 1.21.1 tree's `f_110147_`-style RenderStateShard entries
# and its `DamageSources *()` entry are gone: the first group were already public, and the second is
# dead code that only ever existed for upstream NeoForge's own damage-source extension.

# Vanilla keeps ArgumentTypeInfos#register private; NeoForge 21.3.97 has no public registerByClass
# wrapper in this version, so mixin/common/ArgumentTypeInfosMixin reaches the private static through it.
public net.minecraft.commands.synchronization.ArgumentTypeInfos register(Lnet/minecraft/core/Registry;Ljava/lang/String;Ljava/lang/Class;Lnet/minecraft/commands/synchronization/ArgumentTypeInfo;)Lnet/minecraft/commands/synchronization/ArgumentTypeInfo;
