# NeoForge 20.6 applies access transformers to a **mojmap-named** game jar: NeoForge dropped SRG
# runtime names in the 1.20.5 line, and its own META-INF/accesstransformer.cfg (inside
# neoforge-20.6.144-universal.jar) is written entirely in Mojang names. The 1.21.1 port's
# f_110147_-style SRG entries therefore do not resolve here, which NeoForge reports as a hard
# "no such member" failure while loading the mod.
#
# The set mirrors parcool.accesswidener (Fabric's equivalent); both files have to widen the same
# members, or the shared :common code fails with IllegalAccessError on one of the loaders.

public net.minecraft.client.renderer.RenderStateShard NO_TEXTURE
public net.minecraft.client.renderer.RenderStateShard CULL
public net.minecraft.client.renderer.RenderStateShard NO_CULL
public net.minecraft.client.renderer.RenderStateShard LIGHTMAP
public net.minecraft.client.renderer.RenderStateShard RENDERTYPE_LEASH_SHADER

public net.minecraft.world.entity.Entity onGround

public net.minecraft.world.entity.LivingEntity swimAmount
public net.minecraft.world.entity.LivingEntity swimAmountO

