# Access transformers for NeoForge only; :common carries the equivalent access widener for Fabric.
# Names are Mojang-mapped on purpose: NeoForge's production runtime loads mojmap-named vanilla members
# (verified against a shipped NeoForge mod, Paraglider 21.1.3, whose own accesstransformer.cfg ships
# `aboveGroundTickCount` rather than an `f_110147_` token), so SRG names here would silently never
# match.
#
# Verified with javap against the mojmap 1.21.2 jar: the five RenderStateShard constants below are
# `protected` there, and Entity#onGround / LivingEntity#swimAmount / #swimAmountO are `private`.
public net.minecraft.client.renderer.RenderStateShard NO_TEXTURE
public net.minecraft.client.renderer.RenderStateShard CULL
