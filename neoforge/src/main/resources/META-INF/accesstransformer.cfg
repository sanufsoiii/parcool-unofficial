# Access transformers for NeoForge only; :common carries the equivalent access widener for Fabric.
#
# Names are Mojang-mapped on purpose. NeoForge's production runtime loads mojmap-named vanilla members:
# the neoforge-21.3.97 sources MDG compiles against are mojmap, and a shipped NeoForge mod's own
# accesstransformer.cfg (Paraglider-neoforge-21.1.5) lists `aboveGroundTickCount`, not an `f_110147_`
# token. An `f_...` entry in this file therefore never matches anything and the member stays as it is.
#
# The 1.21.1 tree's `f_110147_`-style RenderStateShard entries and its `DamageSources *()` entry are
# gone: 1.21.3 still uses RenderStateShard rather than RenderSetup, and the damage-source extension
# is dead code that only ever existed for upstream NeoForge's own use.
#
# WHY THE NEXT FOUR ENTRIES EXIST, DESPITE VANILLA DECLARING THEM PUBLIC
# The previous version of this file carried only the ArgumentTypeInfos line, on the reasoning that
# "LivingEntity#swimAmount / #swimAmountO, Entity#onGround and
# Player#canPlayerFitWithinBlocksAndEntitiesWhen are all already public there". That reads the
# *vanilla* jar and is true there:
#
#   javap -p net.minecraft.world.entity.Entity          # 1.21.3 vanilla mojmap
#     public boolean onGround;
#   javap -p net.minecraft.world.entity.LivingEntity
#     public float swimAmount;
#     public float swimAmountO;
#   javap -p net.minecraft.world.entity.player.Player
#     public boolean canPlayerFitWithinBlocksAndEntitiesWhen(net.minecraft.world.entity.Pose);
#
# It is still wrong, because NeoForge ships its own access transformers and narrows them. At runtime
# the members are private and the mod dies on the first player tick:
#
#   [Server thread/ERROR] [ne.ne.bu.EventBus/EVENTBUS]: Exception caught during firing event:
#     class com.alrex.parcool.common.action.AdditionalProperties tried to access private field
#     net.minecraft.world.entity.Entity.onGround
#   java.lang.IllegalAccessError: ... AdditionalProperties.onTick(AdditionalProperties.java:29)
#     at TRANSFORMER/parcool@3.4.3.3/com.alrex.parcool.common.action.ActionProcessor.onTick(...:77)
#     at TRANSFORMER/architectury@14.0.4/dev.architectury.event.forge.EventHandlerImplCommon.event(...:144)
#     at TRANSFORMER/neoforge@21.3.97/net.neoforged.neorge.event.EventHooks.firePlayerTickPost(...:961)
#   [Server thread/ERROR] [minecraft/MinecraftServer]: Encountered an unexpected exception
#     net.minecraft.ReportedException: Ticking player
#
# The Fabric access widener in :common widens all four, which is why the Fabric client of this port
# never showed the problem. NeoForge needs the same set stated here. The four lines below are copied
# from the port that is complete and has been played on NeoForge (1.21.10), with 1.21.3's own
# descriptors.
#
# Note the Pose package: net/minecraft/world/entity/Pose, NOT world/phys/Pose. It moved, and a
# descriptor with the wrong package silently matches nothing - the member simply stays private.

public net.minecraft.world.entity.Entity onGround
public net.minecraft.world.entity.LivingEntity swimAmount
public net.minecraft.world.entity.LivingEntity swimAmountO
public net.minecraft.world.entity.player.Player canPlayerFitWithinBlocksAndEntitiesWhen(Lnet/minecraft/world/entity/Pose;)Z

# Vanilla keeps ArgumentTypeInfos#register private; NeoForge 21.3.97 has no public registerByClass
# wrapper in this version, so mixin/common/ArgumentTypeInfosMixin reaches the private static through it.
public net.minecraft.commands.synchronization.ArgumentTypeInfos register(Lnet/minecraft/core/Registry;Ljava/lang/String;Ljava/lang/Class;Lnet/minecraft/commands/synchronization/ArgumentTypeInfo;)Lnet/minecraft/commands/synchronization/ArgumentTypeInfo;
