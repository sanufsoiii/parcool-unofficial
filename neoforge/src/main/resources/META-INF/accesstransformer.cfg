# Access transformers for NeoForge only; :common carries the equivalent access widener for Fabric.
#
# Names are Mojang-mapped on purpose: NeoForge's production runtime loads mojmap-named vanilla members
# (verified against a shipped NeoForge mod, Paraglider 21.5.2, whose own AT ships `aboveGroundTickCount`
# rather than an `f_110147_` token), so SRG names here would silently never match.
#
# THIS FILE MIRRORS common/src/main/resources/parcool.accesswidener, AND MUST KEEP MIRRORING IT.
#
# An earlier version of this file carried only two entries, ArgumentTypeInfos#register and
# RenderPipelines#PIPELINES_BY_LOCATION, justified by a table that had checked every other member with
# `javap` against the runtime artifact (neoforge/build/moddev/artifacts/neoforge-21.9.16-beta.jar) and
# found it public. The check was sound and the conclusion was wrong. Those bytes are the state
# *before* NeoForge applies its own access transformers; the classes are transformed in memory at
# launch, and after that the members are private. This has bitten ParCool before, on NeoForge, with
# the same reasoning and the same class of members:
#
#   [Server thread/ERROR] [ne.ne.bu.EventBus/EVENTBUS]: Exception caught during firing event:
#     class com.alrex.parcool.common.action.AdditionalProperties tried to access private field
#     net.minecraft.world.entity.Entity.onGround
#   java.lang.IllegalAccessError: ... AdditionalProperties.onTick(AdditionalProperties.java:29)
#   [Server thread/ERROR] [minecraft/MinecraftServer]: Encountered an unexpected exception
#     net.minecraft.ReportedException: Ticking player
#
# The Fabric client never showed it, because the access widener already widens all of these. The rule
# is therefore not "is it private in the jar" but "does :common touch it" - and the authoritative
# answer to the second question is the access widener, which is exactly what this file must duplicate.
# An AT entry for a member that is already public is harmless; a missing entry for one that is not is a
# crash the moment a player ticks. Asymmetric cost, so mirror the widener.
#
# Watch the Pose package: net/minecraft/world/entity/Pose, NOT world/phys/Pose. It moved between
# versions, and a descriptor with the wrong package silently matches nothing - the member simply stays
# private and the failure looks like the entry is absent.

# --- mirrors the widener: common/action and the player helpers touch these ---
public net.minecraft.world.entity.Entity onGround
public net.minecraft.world.entity.LivingEntity swimAmount
public net.minecraft.world.entity.LivingEntity swimAmountO
public net.minecraft.world.entity.player.Player canPlayerFitWithinBlocksAndEntitiesWhen(Lnet/minecraft/world/entity/Pose;)Z

# common/mixin/common/ArgumentTypeInfosMixin shadows ArgumentTypeInfos#register, which is private static
# on 1.21.9 exactly as on 1.21.1/1.21.7 (only 1.21.11 made it public). NeoForge widens the
# registerByClass wrapper, not this one, and a mixin shadow may not narrow access.
public net.minecraft.commands.synchronization.ArgumentTypeInfos register(Lnet/minecraft/core/Registry;Ljava/lang/String;Ljava/lang/Class;Lnet/minecraft/commands/synchronization/ArgumentTypeInfo;)Lnet/minecraft/commands.synchronization.ArgumentTypeInfo;

# --- mirrors the widener: client/renderer/RenderTypes.java builds the two rope pipelines ---
# 1.21.9 deleted RenderStateShard#CULL / #NO_CULL / RENDERTYPE_LEASH_SHADER along with the
# format-carrying RenderType#create overload, so the rope cannot reuse vanilla's leash render type and
# has to own a pipeline - which means writing RenderPipelines#PIPELINES_BY_LOCATION by hand and
# building RenderType#create around it.
public net.minecraft.client.renderer.RenderPipelines PIPELINES_BY_LOCATION
public net.minecraft.client.renderer.RenderType create(Ljava/lang/String;ILcom/mojang/blaze3d/pipeline/RenderPipeline;Lnet/minecraft/client/renderer/RenderType$CompositeState;)Lnet/minecraft/client/renderer/RenderType$CompositeRenderType;
public net.minecraft.client.renderer.RenderStateShard NO_TEXTURE
public net.minecraft.client.renderer.RenderStateShard LIGHTMAP
public net.minecraft.client.renderer.RenderPipelines MATRICES_FOG_SNIPPET
