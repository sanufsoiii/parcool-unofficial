plugins {
	id 'architectury-plugin'
	id 'dev.architectury.loom'
}

// architectury-plugin registers :common's `transformProduction*` tasks while evaluating :common, and
// both loader modules reference them below, so :common has to be evaluated first.
evaluationDependsOn(':common')

// Gradle leaves an undeclared project version at "unspecified", and processResources expands
// ${version} into fabric.mod.json from it - so the shipped mod metadata said `"version": "unspecified"`
// and Fabric Loader warned on every launch:
//   Mod parcool uses the version unspecified which isn't compatible with Loader's extended semantic
//   version format
// :common sets the same value; mirror it so the loader metadata, the jar manifest and the module all
// agree with gradle.properties.
version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	// The access widener lives in :common resources; Loom needs a concrete file to apply it.
	accessWidenerPath = project(':common').file('src/main/resources/parcool.accesswidener')

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// A second client with its own game directory and a fixed name, so two ParCool players can be
		// on one server at the same time - that is what exercises the action-state broadcast path
		// (ActionStateBroadcastPayload / ActionStatePayload) between two real players.
		client2 {
			client()
			runDir = project.file('run-client2')
			programArgs '--username', project.findProperty('parcoolUsername2') ?: 'ParCoolTester2'
		}
	}
}

// The access widener and the mixin config live in :common so both loaders ship the same copy; the
// Fabric module only needs them present in its own jar, because fabric.mod.json references them.
processResources {
	// neoforge.mods.toml points LicenseFile at the LGPL text, so it has to be inside both jars.
	from(rootProject.file('LICENSE'))
}

tasks.named('processResources') {
	def props = [
			version            : project.version,
			mod_id             : project.mod_id,
			mod_name           : project.mod_name,
			mod_license        : project.mod_license,
			mod_authors        : project.mod_authors,
			minecraft_version  : project.minecraft_version,
			neo_version        : project.neo_version,
	]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

// mixin.debug makes the dev log list every applied ParCool mixin (see neoforge/build.gradle).
['runClient', 'runClient2', 'runServer'].each { runTask ->
	tasks.named(runTask) {
		it.jvmArgs '-Dmixin.debug=true', '-Dmixin.debug.verbose=true'
		// `./gradlew :fabric:runClient -PparcoolQuickPlay=host:port` boots straight into a server, and
		// `-PparcoolQuickPlayWorld=<name>` into a saved world; both are how the cross-loader join
		// a cross-loader join and the in-world render pass are reproduced without a mouse.
		if (runTask.startsWith('runClient') && project.hasProperty('parcoolQuickPlay')) {
			it.args '--quickPlayMultiplayer', project.property('parcoolQuickPlay').toString()
		}
		if (runTask == 'runClient' && project.hasProperty('parcoolQuickPlayWorld')) {
			it.args '--quickPlaySingleplayer', project.property('parcoolQuickPlayWorld').toString()
		}
	}
}

// Architectury Loom hands the fabric module the remapped :common *jar*, which carries no
// fabric.mod.json, so Fabric Loader does not treat its assets as mod resources. The common resource
// root is therefore added to this module as well; the distributed jar gets them from the
// transformProductionFabric artifact either way.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
	// javac reads ParCool's own classes from the plain mojmap jar (always in sync with :common, and
	// immune to Loom's stale remap cache); `modImplementation` supplies the remapped artifact that
	// the dev run actually loads.
	compileOnly project(':common')
	modImplementation project(':common')

	// Upstream uses javax.annotation.Nullable/Nonnull throughout; NeoForge puts JSR-305 on the
	// compile classpath for free, Loom does not.
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "com.google.code.gson:gson:2.10.1"
}

/**
 * The distributable Fabric jar: the SRG/intermediary-transformed :common artifact plus this
 * module's own classes, the loader metadata and the ServiceLoader registration.
 *
 * architectury-plugin's `neoForge()`/`fabric()` transform normally does this, but the NeoForge side
 * of that transform requires a Loom extension that cannot set up NeoForge 21.1 (see
 * neoforge/build.gradle), so the assembly is done explicitly here and mirrored in :neoforge.
 */
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('distJar', Jar) {
	group = 'build'
	description = 'Assembles the distributable Fabric jar (common + fabric module).'

	archiveClassifier = 'fabric'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	// The distributable is built from :common's remapJar output, NOT from architectury-plugin's
	// transformProductionFabric artifact.
	//
	// Why: architectury-plugin's transform runs in "named" mode unless the Loom NeoForge extension is
	// present, and its Fabric half therefore emitted mojmap bytecode - a jar that loads in a mojmap
	// dev environment and nowhere else. :common:remapJar is Loom's own publish step: it applies the
	// access widener, converts named -> intermediary and, because Loom 1.17 defaults to
	// `mixinRemapType = static`, rewrites the mixin targets (both the annotation strings and the @Shadow
	// descriptors) straight into the bytecode. That is why there is no refmap: fabric-api 0.141.6, built
	// with the same Loom, ships none either and advertises
	// `Fabric-Loom-Mixin-Remap-Type: static` in its manifest.
	//
	// Reading the archive inside a `from { }` closure gives Gradle no way to order the two tasks, so
	// the dependency is declared explicitly.
	dependsOn ':common:remapJar'
	dependsOn ':fabric:remapJar'

	// zipTree, not a plain file copy, so the remapped code is expanded into the output jar.
	//
	// Order matters, and not only for readability: duplicatesStrategy is EXCLUDE, so the first `from`
	// that contributes an entry wins.
	//
	// This module goes first on purpose. :fabric:remapJar carries the four loader-side classes already
	// remapped to intermediary (ParCoolFabric, ParCoolFabricClient, FabricParCoolPlatform,
	// FabricParCoolNetwork) - `sourceSets.main.output` is the raw mojmap output, and shipping it as-is
	// left FabricParCoolPlatform referencing net.minecraft.core.BlockPos and FabricParCoolNetwork
	// referencing net.minecraft.network.codec.StreamCodec in a jar meant for an intermediary client.
	//
	// It also carries the authoritative access widener, remapped to `v2 intermediary`. :common:remapJar
	// leaves the access widener in `v2 named` (its namespacesMatch() is true, so Loom copies it
	// verbatim), and Fabric Loader 0.19.5 refuses that outright on a production client:
	//     ClassTweakerFormatException: line 1: Namespace (named) does not match current runtime
	//     namespace (intermediary)
	// which aborts the boot before the game window exists. So the common copy is dropped below.
	from({
		zipTree(tasks.named('remapJar').get().archiveFile.get().asFile)
	})

	// The remapped :common code, which :fabric:remapJar does not contain (the module compiles against
	// it with `compileOnly project(':common')`, so the common classes are not in its own output).
	from({
		zipTree(project(':common').tasks.named('remapJar').get().archiveFile.get().asFile)
	}) {
		exclude 'parcool.accesswidener'
	}
	from(configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }) {
		include 'META-INF/services/com.alrex.parcool.platform.ParCoolPlatform'
	}

	manifest {
		attributes(
				'Implementation-Title': project.mod_name,
				'Implementation-Version': project.mod_version,
				'Implementation-Vendor': project.mod_authors
		)
	}
}

tasks.named('assemble') {
	dependsOn 'distJar'
}
