org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.20.5
# NeoForge 20.5.21-beta is the last of the 20.5 line, which is the Minecraft 1.20.5 line (the 20.6
# line starts at 1.20.6, 21.0 at 1.21). Read from
# https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
neo_version=20.5.21-beta
# 0.16.14 is the last stable loader of the 0.16 line and above fabric-api 0.97.8's >=0.15.6 floor;
# read from https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml
loader_version=0.16.14
# 0.97.8+1.20.5 is the last fabric-api published for 1.20.5 (0.100.x moved to 1.20.6). Read from
# https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml
fabric_api_version=0.97.8+1.20.5

# Architectury
# 12.x is the architectury line targeting Minecraft 1.20.5/1.20.6. architectury-neoforge 12.0.29 (the
# last 12.0.x, the 1.20.5 line) declares `minecraft [1.20.5,)` / `neoforge [20.5.0-beta,)` in its
# neoforge.mods.toml; 12.1.x is the 1.20.6 line. Read from
# https://maven.architectury.dev/dev/architectury/architectury-neoforge/maven-metadata.xml
architectury_api_version=12.0.29

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
