org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.6
neo_version=21.6.20-beta
loader_version=0.16.10
fabric_api_version=0.128.2+1.21.6

# Architectury
# 17.x is the architectury line targeting Minecraft 1.21.6: architectury-fabric 17.0.3/17.0.4 declare
# depends.minecraft = "~1.21.6~" and 17.0.6 = "~1.21.6"; 17.0.8 and 18.0.x already declare "~1.21.7",
# so 17.0.6 is the newest release on this line.
architectury_api_version=17.0.6

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
