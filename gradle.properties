org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.20.6
# NeoForge 20.6.144 is the last non-beta of the 20.6 line (the 20.6 line ends there; 20.7/21.0 start
# at Minecraft 1.21). Read from
# https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
neo_version=20.6.144
# 0.16.14 is the last stable loader of the 0.16 line and above fabric-api 0.100.8's >=0.15.11 floor;
# read from https://meta.fabricmc.net/v2/versions/loader/1.20.6
loader_version=0.16.14
# 0.100.8+1.20.6 is the last fabric-api published for 1.20.6 (0.102.x moved to 1.21). Read from
# https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml
fabric_api_version=0.100.8+1.20.6

# Architectury
# 12.x is the architectury line targeting Minecraft 1.20.5/1.20.6. architectury-neoforge 12.1.4
# declares `minecraft [1.20.6,)` / `neoforge [20.6.98-beta,)` in its neoforge.mods.toml, and
# architectury-fabric 12.1.4 declares `minecraft ~1.20.6-`; read from
# https://maven.architectury.dev/dev/architectury/architectury-neoforge/maven-metadata.xml
architectury_api_version=12.1.4

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
