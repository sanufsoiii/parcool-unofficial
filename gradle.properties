org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.20.2
# 0.16.14 is the newest stable loader of the 0.16 line and clears the `>=0.14.22` floor that
# fabric-api 0.91.6+1.20.2 declares; read from
# https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml
loader_version=0.16.14
fabric_api_version=0.91.6+1.20.2
# Forge 48.x is the line for Minecraft 1.20.2 (49.x is 1.20.3/1.20.4, 47.x is 1.20/1.20.1).
# 48.1.0 is the newest 1.20.2 build in maven.minecraftforge.net's metadata (Forge moved on to the
# 49.x line once 1.20.3 arrived). Unlike 49.0.2 it still ships the older BootstrapLauncher, so the
# dev-run workarounds the 1.20.3/1.20.4 trees need do not apply here.
forge_version=1.20.2-48.1.0

# Architectury
# 10.x is the architectury line targeting Minecraft 1.20.2. 10.1.20 is the newest 10.x in
# maven.architectury.dev; its Forge half declares `minecraft: "[1.20.2,)"` and `forge: "[48,)"`,
# and the Fabric half declares `minecraft: "~1.20.2-"`.
architectury_api_version=10.1.20

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
