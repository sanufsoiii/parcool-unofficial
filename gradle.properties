org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.2
# NeoForge's 1.21.2 line is only two builds long: 21.2.0-beta and 21.2.1-beta. 21.2.1-beta's pom
# pins neoform 1.21.2-20241022.151510, so it is the newest NeoForge that targets this Minecraft.
neo_version=21.2.1-beta
loader_version=0.16.10
# 0.106.1+1.21.2 is the last fabric-api published for 1.21.2 (0.107.x moved to 1.21.3).
fabric_api_version=0.106.1+1.21.2

# Architectury
# 14.x is the architectury line targeting Minecraft 1.21.2: architectury-fabric 14.0.4 declares
# depends.minecraft = "~1.21.2-" in its fabric.mod.json, and architectury-neoforge 14.0.4 requires
# MC [1.21,) / NF [21.0.110-beta,). 13.x is the 1.21.1 line and 15.x starts at 1.21.4.
architectury_api_version=14.0.4

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
