org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.1
parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28
neo_version=21.1.217
loader_version=0.16.5
yarn_mappings=1.21.1+build.3:v2
fabric_api_version=0.116.15+1.21.1

# Architectury
# 13.x is the architectury line targeting Minecraft 1.21.x (13.0.11 requires MC [1.21,) / NF [21.0.110-beta,))
architectury_api_version=13.0.11

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
