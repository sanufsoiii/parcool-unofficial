org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
# Resolved 2026-09-30. Each number was read from the publisher's own metadata endpoint.
minecraft_version=1.21.9
# NeoForge publishes no non-beta build for 1.21.9; every 21.9.x release carries the -beta suffix.
# 21.9.16-beta is the last one.
neo_version=21.9.16-beta
# https://meta.fabricmc.net/v2/versions/loader/1.21.9 -> loader[0].loader.version
loader_version=0.19.5
# Last fabric-api release in the +1.21.9 line of maven.fabricmc.net's fabric-api maven-metadata.xml.
fabric_api_version=0.134.1+1.21.9

# Architectury
# Two independent constraints pick the version, and BOTH have to hold:
#
#  (1) `depends.minecraft` inside architectury-fabric's own fabric.mod.json, because
#      architectury-neoforge declares the same MC [1.21.4,) / NF [21.0.110-beta,) range in every
#      16.x-19.x build and therefore says nothing about the target:
#          16.0.3 / 16.1.4    -> ~1.21.4-    (1.21.4 line)
#          17.0.3 / 17.0.4    -> ~1.21.6~    (1.21.6 prereleases)
#          17.0.6             -> ~1.21.6     (1.21.6 line)
#          17.0.8, 18.0.2-18.0.8 -> ~1.21.7 (>=1.21.7 <1.22.0, i.e. the whole 1.21.7+ line)
#          19.0.1             -> ~1.21.11    (>=1.21.11, so it REFUSES 1.21.9 outright)
#
#  (2) the fabric-api version architectury-fabric drags in, because Gradle resolves the conflict with
#      "highest wins" and architectury-fabric declares fabric-api as a HARD (scope=runtime,
#      non-optional) dependency. fabric-api versions are MC-pinned: 0.134.1+1.21.9 declares
#      depends.minecraft >=1.21.9- <1.21.10-, while 0.136.0+1.21.10 declares >=1.21.10- <1.21.11-.
#      If Architectury's copy wins, Fabric Loader aborts the boot BEFORE the window exists:
#          [FabricLoader/Resolution] Immediate reason: [HARD_DEP architectury 18.0.8
#            {depends fabric-api @ [>=0.127.0]},
#            HARD_DEP_INCOMPATIBLE_PRESELECTED fabric-api 0.136.0+1.21.10
#            {depends minecraft @ [>=1.21.10- <1.21.11-)}, ROOT_FORCELOAD_SINGLE architectury 18.0.8]
#          [FabricLoader/ERROR] Incompatible mods found!
#      What each candidate pulls (read out of the .module/.pom on maven.architectury.dev):
#          18.0.8        -> fabric-api 0.136.0+1.21.10  (0.136.0 > 0.134.1  => PORT LOSES)  BROKEN
#          18.0.5/18.0.4 -> fabric-api 0.133.14+1.21.9   (0.133.14 < 0.134.1 => port wins)  ok
#          18.0.3/18.0.2 -> fabric-api 0.133.14+1.21.9   (same)                              ok
#          17.0.8        -> fabric-api 0.128.1+1.21.7   (0.128.1 < 0.134.1 => port wins)  ok
#      0.134.1+1.21.9 is the newest fabric-api in the +1.21.9 line
#      (https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml), so
#      0.133.14+1.21.9 is the highest Architectury build may request without out-ranking the port.
#
# 18.0.5 is therefore the newest Architectury that satisfies both. 18.0.6/18.0.7 are not published
# (the 18.x line on maven.architectury.dev is 18.0.2-18.0.5, 18.0.8).
#
# API compatibility was checked rather than assumed: javap over the 17 dev.architectury classes
# ParCool references gives byte-identical signatures in architectury{,-fabric,neoforge} 18.0.5 and
# 18.0.8, except that 18.0.5 still declares
# ClientGuiEvent.DEBUG_TEXT_LEFT / DEBUG_TEXT_RIGHT, which 18.0.8 removed. ParCool uses neither
# (grep for DebugText over common/src, fabric/src, neoforge/src is empty), so the downgrade is a
# strict superset for this port. architectury-neoforge 18.0.5 declares the same
# minecraft [1.21.4,) / neoforge [21.0.110-beta,) as 18.0.8, so it accepts 21.9.16-beta.
architectury_api_version=18.0.5

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
