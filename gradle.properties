org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.20.4
# 0.16.14 is the newest stable loader of the 0.16 line and clears the `>=0.15.1` floor that
# fabric-api 0.97.3+1.20.4 declares; read from
# https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml
loader_version=0.16.14
fabric_api_version=0.97.3+1.20.4
# Forge 49.x is the line for Minecraft 1.20.3/1.20.4 (48.x is 1.20.2, 47.x is 1.20/1.20.1).
# 49.2.13 is the newest 1.20.4 build in maven.minecraftforge.net's metadata; upstream ParCool's
# 1.20.4 branch pins an older 49.x build.
forge_version=1.20.4-49.2.13

# Architectury
# 11.x is the architectury line targeting Minecraft 1.20.3/1.20.4. 11.1.17 is the newest 11.x in
# maven.architectury.dev; its Forge half declares `minecraft: "[1.20.3,)"` and `forge: "[49,)"`,
# and the Fabric half declares `minecraft: "~1.20.3-"`, so it covers both 1.20.3 and 1.20.4.
architectury_api_version=11.1.17

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
