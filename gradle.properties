org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
# 1.21 is the first release of the 1.21 line; 1.21.1 is a hotfix on top of it and has its own port
# tree next door. The line has no separate Fabric Loader or mappings delta, so the loader/yarn
# leftovers the 1.21.1 tree carried (parchment_minecraft_version, parchment_mappings_version,
# yarn_mappings) are dropped here: nothing in this build reads them, the project is mojmap-only.
minecraft_version=1.21
# Newest build of the NeoForge 21.0 line (21.1.x is the same Minecraft with a bumped NeoForge
# version line, and the port for it exists as its own folder). architectury-neoforge 13.0.11
# requires neoforge >= 21.0.110-beta, which 21.0.167 satisfies.
neo_version=21.0.167
loader_version=0.16.5
# 0.102.0+1.21 is the last fabric-api published for Minecraft 1.21.
fabric_api_version=0.102.0+1.21

# Architectury
# 13.x is the architectury line targeting Minecraft 1.21: architectury-fabric 13.0.11 declares
# depends.minecraft = "~1.21-" (semver: >=1.21 <1.22) and architectury-neoforge 13.0.11 requires
# MC [1.21,) / NF [21.0.110-beta,). 14.x moved to Minecraft 1.21.2.
architectury_api_version=13.0.11

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
