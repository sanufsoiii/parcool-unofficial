org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
# 1.21.5 verified against the Mojang launcher metadata: protocol 770, pack_version {resource 55,
# data 71}, release 2025-03-25.
minecraft_version=1.21.5
# Newest release of the NeoForge 21.5 line (21.6.x is already out and targets MC 1.21.6+).
neo_version=21.5.98
# Newest 0.16.x Fabric Loader, i.e. the line contemporary with MC 1.21.5. fabric-api 0.128.2+1.21.5
# asks for fabricloader >= 0.16.10, so 0.16.14 is the newest line that both is and satisfies it.
loader_version=0.16.14
fabric_api_version=0.128.2+1.21.5

# Architectury
# 16.x is the newest architectury line that still accepts Minecraft 1.21.5: architectury-fabric
# 16.1.4 declares depends.minecraft = "~1.21.4-" (semver, so >=1.21.4 <1.22.0) and
# architectury-neoforge 16.1.4 requires MC [1.21.4,) / NF [21.0.110-beta,), which 21.5.98 satisfies.
# 17.x moved to depends.minecraft = "~1.21.7" and refuses 1.21.5, so it must not be used here.
architectury_api_version=16.1.4

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
