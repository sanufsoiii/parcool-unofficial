org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.4
neo_version=21.4.158
loader_version=0.16.14
fabric_api_version=0.119.4+1.21.4

# Architectury
# 16.x is the architectury line that targets Minecraft 1.21.4: architectury-fabric 16.1.4 declares
# depends.minecraft = "~1.21.4-" in its fabric.mod.json and architectury-neoforge 16.1.4 requires
# MC [1.21.4,) / NF [21.0.110-beta,). 15.0.3 targets the same MC line; 16.1.4 is its newer sibling.
# 17.x already moved to ~1.21.7 and must not be used here.
architectury_api_version=16.1.4

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
