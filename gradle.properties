org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.8
# NeoForge version numbers encode the Minecraft version they target: 21.6.x -> 1.21.6, 21.7.x -> 1.21.7,
# 21.8.x -> 1.21.8. 21.8.54 is the newest release of the 21.8 line
# (https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml).
neo_version=21.8.54
loader_version=0.16.14
fabric_api_version=0.136.1+1.21.8

# Architectury
# 17.0.8 is the architectury line that targets the 1.21.7 / 1.21.8 releases: Modrinth publishes
# architectury-api 17.0.8+fabric for game versions ['1.21.7', '1.21.8'] and it is the newest
# architectury-fabric whose bytecode was compiled against a 1.21.7 codebase (1.21.8 is a pure bugfix
# release of it). 18.x is already the 1.21.9 / 1.21.10 line (Modrinth lists 18.0.3 / 18.0.5 for
# 1.21.9), 19.0.1 is '~1.21.11' and 20.x has moved on to 26.1.
# NOTE: architectury-fabric declares `"minecraft": "~1.21.7"`. In Fabric Loader's version predicate
# syntax `~` is SAME_TO_NEXT_MINOR (>= 1.21.7, < 1.22.0) - verified with javap on
# fabric-loader-0.19.5's VersionComparisonOperator enum, where "~" maps to SAME_TO_NEXT_MINOR - so
# 1.21.8 satisfies it. `architectury-neoforge 17.0.8` requires MC [1.21.4,) / NF [21.0.110-beta,),
# which 21.8.54 satisfies.
architectury_api_version=17.0.8

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
