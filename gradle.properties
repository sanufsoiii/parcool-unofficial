org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.11
neo_version=21.11.45
loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11

# Architectury
# 19.x is the architectury line targeting Minecraft 1.21.11 (architectury-fabric 19.0.1 declares
# depends.minecraft = "~1.21.11" in its fabric.mod.json, architectury-neoforge 19.0.1 requires MC
# [1.21.4,) / NF [21.0.110-beta,)).
architectury_api_version=19.0.1

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
