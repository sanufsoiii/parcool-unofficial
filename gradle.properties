org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.7
# NeoForge version numbers encode the Minecraft version they target: 21.7.x-beta is the MC 1.21.7
# line (21.6.x-beta -> 1.21.6, 21.8.x-beta -> 1.21.8). 21.7.25-beta is the newest release of it
# (https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml).
neo_version=21.7.25-beta
loader_version=0.16.14
fabric_api_version=0.128.2+1.21.7

# Architectury
# 19.0.1 declares minecraft "~1.21.11" and 20.x has moved on to 26.1, so neither can load on 1.21.7.
# That leaves 17.0.8 and the 18.x line, both of which declare minecraft "~1.21.7"
# (>=1.21.7 <1.22.0, so 1.21.7 is inside), and architectury-neoforge declares the same broad
# minecraft [1.21.4,) / neoforge [21.0.110-beta,) in every 17.x-19.x build.
#
# The tie is broken by the fabric-api version architectury-fabric drags in. architectury-fabric
# declares fabric-api as a HARD (scope=runtime, non-optional) dependency and Gradle resolves the
# conflict with "highest wins", so a too-new Architectury silently replaces the fabric-api declared
# in this file. fabric-api builds are MC-pinned - 0.136.0+1.21.10 declares
# depends.minecraft >=1.21.10- <1.21.11- - and Fabric Loader aborts the boot BEFORE the window
# exists when a mod on the classpath asks for a Minecraft that is not the one being run:
#     [FabricLoader/Resolution] Immediate reason: [HARD_DEP architectury 18.0.8
#       {depends fabric-api @ [>=0.127.0]},
#       HARD_DEP_INCOMPATIBLE_PRESELECTED fabric-api 0.136.0+1.21.10
#       {depends minecraft @ [>=1.21.10- <1.21.11-)}, ROOT_FORCELOAD_SINGLE architectury 18.0.8]
#     [FabricLoader/ERROR] Incompatible mods found!
# What each candidate pulls (read out of the .module/.pom on maven.architectury.dev):
#     18.0.8        -> fabric-api 0.136.0+1.21.10 (0.136.0 > 0.128.2  => PORT LOSES)  BROKEN
#     18.0.5/18.0.2 -> fabric-api 0.133.14+1.21.9  (0.133.14 > 0.128.2 => PORT LOSES)  BROKEN
#     17.0.8        -> fabric-api 0.128.1+1.21.7  (0.128.1 < 0.128.2 => port wins)   ok
# 0.128.2+1.21.7 is the version this port pins; 0.128.1+1.21.7 is one notch below it, so the
# port's own declaration wins and the classpath stays inside the +1.21.7 line
# (0.128.2+1.21.7 declares depends.minecraft >=1.21.7- <1.21.8-).
# 17.0.8 also drags fabric-loader 0.16.14, which is exactly what this port pins; with architectury
# 18.0.8 the loader was silently bumped to 0.17.2 by the same conflict, and the run log confirmed it
# ("Loading Minecraft 1.21.7 with Fabric Loader 0.17.2" instead of 0.16.14).
#
# API compatibility was checked rather than assumed: javap over the 17 dev.architectury classes
# ParCool references gives byte-identical signatures in architectury{,-fabric,neoforge} 17.0.8 and
# 18.0.8, except that 17.0.8 still declares
# ClientGuiEvent.DEBUG_TEXT_LEFT / DEBUG_TEXT_RIGHT, which 18.0.8 removed. ParCool uses neither
# (grep for DebugText over common/src, fabric/src, neoforge/src is empty), so the downgrade is a
# strict superset for this port. architectury-neoforge 17.0.8 declares the same
# minecraft [1.21.4,) / neoforge [21.0.110-beta,) as 18.0.8, so it accepts 21.7.25-beta.
#
# The mod's own declared lower bounds moved with it: fabric.mod.json depended on
# architectury ">=18.0.0" and neoforge.mods.toml on "[18.0.0,)", which made the port refuse to load
# against its own Architectury:
#     [FabricLoader/Resolution] Immediate reason: [HARD_DEP_NO_CANDIDATE parcool 1.21.7-3.4.3.3
#       {depends architectury @ [>=18.0.0]}, ROOT_FORCELOAD_SINGLE parcool 1.21.7-3.4.3.3]
#     [FabricLoader/ERROR] Incompatible mods found!
#     - Mod 'ParCool!' (parcool) requires version 18.0.0 or later of mod 'Architectury', but only the
#       wrong version is present: 17.0.8!
# Both bounds are now 17.0.8, which is what the working 1.21.8 port declares even though it is also
# built against architectury 17.0.8 - i.e. the ">=18.0.0" here was a copy of the 1.21.9/1.21.10
# value, not a real requirement of this port.
architectury_api_version=17.0.8

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
