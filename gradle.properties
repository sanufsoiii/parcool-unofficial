org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.20
# 0.16.14 is the newest stable loader of the 0.16 line and clears the `>=0.14.21` floor that
# fabric-api 0.83.0 declares; read from
# https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml
loader_version=0.16.14
fabric_api_version=0.83.0+1.20
# Forge 46.x is the line for Minecraft 1.20 (there is no NeoForge for 1.20/1.20.1; NeoForge starts at
# 1.20.2). 46.0.14 is the newest 1.20 build in maven.minecraftforge.net's metadata.
forge_version=1.20-46.0.14

# Architectury
# 9.x is the architectury line targeting Minecraft 1.20.x. 9.2.14 is the newest 9.x in
# maven.architectury.dev; its fabric.mod.json declares `minecraft: "~1.20-"`, so it covers 1.20 and
# 1.20.1.
architectury_api_version=9.2.14

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
