org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom needs :common's dev jar to exist before it configures the loader modules, so the
# platform projects must not be configured before :common has been built.
org.gradle.configureondemand=true

# Minecraft / toolchain
minecraft_version=1.21.10
neo_version=21.10.64
loader_version=0.19.5
fabric_api_version=0.138.4+1.21.10

# Architectury
# 18.0.8 is the newest Architectury line that covers Minecraft 1.21.10. Verified by downloading the
# candidate jars and reading their metadata rather than trusting the version number:
#   architectury-fabric 16.1.4 -> depends.minecraft = "~1.21.4-"  (= >=1.21.4 <1.22.0)
#   architectury-fabric 17.0.6 -> depends.minecraft = "~1.21.6"
#   architectury-fabric 18.0.8 -> depends.minecraft = "~1.21.7"  (covers 1.21.10)
#   architectury-fabric 19.0.1 -> depends.minecraft = "~1.21.11" (does NOT cover 1.21.10)
#   architectury-fabric 20.0.2+ -> depends.minecraft = ">=26.1"  (the next naming scheme)
# 19.0.1 is the version the 1.21.11 tree uses; it is unusable here because Fabric Loader enforces
# that range and 1.21.10 is outside it. On the NeoForge side both 18.0.8 and 19.0.1 declare
# minecraft "[1.21.4,)" / neoforge "[21.0.110-beta,)", so 18.0.8 is also valid there.
architectury_api_version=18.0.8

# Mod
mod_id=parcool
mod_name=ParCool!
mod_license=LGPL-3.0
mod_version=3.4.3.3
mod_authors=alRex_U
maven_group=com.alrex.parcool
archives_base_name=parcool
